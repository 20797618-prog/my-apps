<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约网站导航 - 卡片式仪表板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            --success-color: #4caf50;
            --danger-color: #f44336;
            --warning-color: #ff9800;
        }

        body.dark-theme {
            --background-color: #1a1a2e;
            --card-background: #16213e;
            --text-color: #e6e6e6;
            --border-color: #2d3748;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        body.app-locked {
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
            color: var(--primary-color);
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 10px 15px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-background);
            color: var(--text-color);
            width: 250px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-outline:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #d32f2f;
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #388e3c;
        }

        .theme-toggle {
            width: 50px;
            height: 28px;
            border-radius: 14px;
            background-color: var(--border-color);
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .theme-toggle.active {
            background-color: var(--primary-color);
        }

        .theme-toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: white;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .theme-toggle.active::after {
            transform: translateX(22px);
        }

        .selection-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-background);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .selection-bar.active {
            display: flex;
        }

        .selection-info {
            font-size: 16px;
            font-weight: 500;
        }

        .selection-actions {
            display: flex;
            gap: 10px;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .category-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .category-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .category-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .bookmark-card {
            background-color: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
        }

        .bookmark-card.selected {
            border-color: var(--primary-color);
        }

        .bookmark-card .checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--card-background);
        }

        .bookmark-card.selected .checkbox {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .bookmark-card.selected .checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .bookmark-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 24px;
            overflow: hidden;
        }

        .bookmark-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bookmark-icon i {
            color: var(--primary-color);
        }

        .bookmark-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-url {
            font-size: 12px;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 12px;
        }

        .bookmark-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag {
            background-color: rgba(67, 97, 238, 0.1);
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .bookmark-actions {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bookmark-card:hover .bookmark-actions {
            opacity: 1;
        }

        .bookmark-actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .bookmark-actions button:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--text-color);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-background);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #888;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .modal-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-background);
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 14px;
            border-top: 1px solid var(--border-color);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1001;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .urls-list {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background-color: var(--card-background);
            color: var(--text-color);
            padding: 15px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1001;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s, transform 0.3s;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
        }

        .urls-list.show {
            opacity: 1;
            transform: translateY(0);
        }

        .urls-list h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .urls-list ul {
            list-style-type: none;
            padding-left: 0;
        }

        .urls-list li {
            margin-bottom: 5px;
            padding: 5px;
            border-bottom: 1px solid var(--border-color);
        }

        .urls-list li:last-child {
            border-bottom: none;
        }

        .urls-list a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .urls-list a:hover {
            text-decoration: underline;
        }

        .close-urls-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            position: absolute;
            top: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-urls-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-overlay.active {
            display: flex;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-background);
            color: var(--text-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            padding: 24px;
        }

        .login-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .login-card p {
            color: #888;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .login-card .form-group {
            margin-bottom: 16px;
        }

        .login-card .btn {
            width: 100%;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            
            .actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .search-box input {
                width: 200px;
            }
            
            .bookmarks-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .toast, .urls-list {
                left: 20px;
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            .bookmarks-grid {
                grid-template-columns: 1fr;
            }
            
            .selection-bar {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .selection-actions {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h2>请输入访问口令</h2>
            <p>登录成功后将自动导入最新书签数据</p>
            <form id="loginForm">
                <div class="form-group">
                    <input type="password" id="passphraseInput" class="form-control" placeholder="请输入口令" autocomplete="off" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
                    <i class="fas fa-unlock"></i>登录并同步数据
                </button>
            </form>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <i class="fas fa-compass"></i>
            <h1>网站导航仪表板</h1>
        </div>
        <div class="actions">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索网站...">
            </div>
            <button class="btn btn-outline" id="exportBtn" title="导出书签">
                <i class="fas fa-download"></i>导出
            </button>
            <button class="btn btn-outline" id="importBtn" title="导入书签">
                <i class="fas fa-upload"></i>导入
            </button>
            <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;">
            <button class="btn btn-outline" id="selectAllBtn">
                <i class="fas fa-check-square"></i>全选
            </button>
            <button class="btn btn-primary" id="addBookmarkBtn">
                <i class="fas fa-plus"></i>添加网站
            </button>
            <div class="theme-toggle" id="themeToggle">
                <i class="fas fa-sun"></i>
            </div>
        </div>
    </div>

    <div class="selection-bar" id="selectionBar">
        <div class="selection-info">
            已选择 <span id="selectedCount">0</span> 个网站
        </div>
        <div class="selection-actions">
            <button class="btn btn-outline" id="copyUrlsBtn">
                <i class="fas fa-copy"></i>复制URL
            </button>
            <button class="btn btn-outline" id="cancelSelectionBtn">
                <i class="fas fa-times"></i>取消选择
            </button>
            <button class="btn btn-success" id="openSelectedBtn">
                <i class="fas fa-external-link-alt"></i>打开选中网站
            </button>
        </div>
    </div>

    <div class="categories" id="categoriesContainer">
        <button class="category-btn active" data-category="all">全部网站</button>
        <!-- 分类将通过JavaScript动态生成 -->
    </div>

    <div class="bookmarks-grid" id="bookmarksGrid">
        <!-- 书签卡片将通过JavaScript动态生成 -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-bookmark"></i>
            <h3>还没有添加任何网站</h3>
            <p>点击右上角的"添加网站"按钮开始添加您常用的网站</p>
        </div>
    </div>

    <!-- 添加/编辑书签模态框 -->
    <div class="modal" id="bookmarkModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">添加新网站</div>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="bookmarkForm">
                    <div class="form-group">
                        <label for="bookmarkName">网站名称 *</label>
                        <input type="text" id="bookmarkName" class="form-control" required placeholder="例如：GitHub">
                    </div>
                    <div class="form-group">
                        <label for="bookmarkUrl">网站地址 *</label>
                        <input type="url" id="bookmarkUrl" class="form-control" required placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label for="bookmarkCategory">分类</label>
                        <input type="text" id="bookmarkCategory" class="form-control" placeholder="开发工具、设计资源等">
                    </div>
                    <div class="form-group">
                        <label for="bookmarkTags">标签（用逗号分隔）</label>
                        <input type="text" id="bookmarkTags" class="form-control" placeholder="代码托管, 版本控制">
                    </div>
                    <div class="form-group">
                        <label for="bookmarkIcon">图标URL（可选）</label>
                        <input type="text" id="bookmarkIcon" class="form-control" placeholder="留空将自动获取网站图标">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- URL列表弹窗 -->
    <div class="urls-list" id="urlsList">
        <button class="close-urls-btn" id="closeUrlsBtn">&times;</button>
        <h3>选中网站的URL列表</h3>
        <ul id="urlsListContent">
            <!-- URL列表将在这里动态生成 -->
        </ul>
    </div>

    <div class="footer">
        <p>简约网站导航系统 &copy; 2024 | 已保存 <span id="totalCount">0</span> 个书签</p>
    </div>

    <!-- 引入SortableJS实现拖拽功能 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    
    <script>
        const ACCESS_PASSPHRASE = '20797618';
        const LATEST_BACKUP_FILES = [
            'bookmarks-backup-2026-09-06.json',
            'bookmarks-backup-2026-05-09.json'
        ];

        // 应用程序状态
        const state = {
            bookmarks: [],
            selectedBookmarks: new Set(),
            editingBookmarkId: null,
            currentCategory: 'all',
            searchQuery: '',
            darkTheme: localStorage.getItem('darkTheme') === 'true'
        };

        // DOM元素引用
        const elements = {
            bookmarksGrid: document.getElementById('bookmarksGrid'),
            searchInput: document.getElementById('searchInput'),
            addBookmarkBtn: document.getElementById('addBookmarkBtn'),
            themeToggle: document.getElementById('themeToggle'),
            selectionBar: document.getElementById('selectionBar'),
            selectedCount: document.getElementById('selectedCount'),
            openSelectedBtn: document.getElementById('openSelectedBtn'),
            copyUrlsBtn: document.getElementById('copyUrlsBtn'),
            cancelSelectionBtn: document.getElementById('cancelSelectionBtn'),
            selectAllBtn: document.getElementById('selectAllBtn'),
            bookmarkModal: document.getElementById('bookmarkModal'),
            modalTitle: document.getElementById('modalTitle'),
            modalClose: document.getElementById('modalClose'),
            cancelBtn: document.getElementById('cancelBtn'),
            bookmarkForm: document.getElementById('bookmarkForm'),
            bookmarkName: document.getElementById('bookmarkName'),
            bookmarkUrl: document.getElementById('bookmarkUrl'),
            bookmarkCategory: document.getElementById('bookmarkCategory'),
            bookmarkTags: document.getElementById('bookmarkTags'),
            bookmarkIcon: document.getElementById('bookmarkIcon'),
            saveBtn: document.getElementById('saveBtn'),
            categoriesContainer: document.getElementById('categoriesContainer'),
            emptyState: document.getElementById('emptyState'),
            totalCount: document.getElementById('totalCount'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            urlsList: document.getElementById('urlsList'),
            closeUrlsBtn: document.getElementById('closeUrlsBtn'),
            urlsListContent: document.getElementById('urlsListContent'),
            exportBtn: document.getElementById('exportBtn'),
            importBtn: document.getElementById('importBtn'),
            importFileInput: document.getElementById('importFileInput'),
            loginOverlay: document.getElementById('loginOverlay'),
            loginForm: document.getElementById('loginForm'),
            passphraseInput: document.getElementById('passphraseInput'),
            loginSubmitBtn: document.getElementById('loginSubmitBtn')
        };

        // 工具函数：显示提示消息
        function showToast(message, duration = 3000) {
            elements.toastMessage.textContent = message;
            elements.toast.classList.add('show');
            
            setTimeout(() => {
                elements.toast.classList.remove('show');
            }, duration);
        }

        // 初始化应用程序
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadBookmarks();
            initEventListeners();

        async function handleLoginSuccess() {
            hideLoginOverlay();
            showToast('口令正确，正在导入最新数据...', 1600);
            await autoImportLatestData();
        }

        async function autoImportLatestData() {
            for (const fileName of LATEST_BACKUP_FILES) {
                try {
                    const response = await fetch(fileName, { cache: 'no-store' });
                    if (!response.ok) {
                        continue;
                    }

                    const data = await response.json();
                    if (!data.bookmarks || !Array.isArray(data.bookmarks)) {
                        continue;
                    }

                    const isValid = data.bookmarks.every(b =>
                        b.id && b.name && b.url && typeof b.name === 'string' && typeof b.url === 'string'
                    );

                    if (!isValid) {
                        continue;
                    }

                    state.bookmarks = data.bookmarks.map((bookmark, index) => ({
                        ...bookmark,
                        order: bookmark.order !== undefined ? bookmark.order : index,
                        category: bookmark.category || '未分类'
                    }));

                    state.selectedBookmarks.clear();
                    saveBookmarks();
                    renderCategories();
                    renderBookmarks();
                    showToast(`已自动导入最新数据：${fileName}`, 2600);
                    return;
                } catch (error) {
                    console.warn(`自动导入失败：${fileName}`, error);
                }
            }

            showToast('未找到可用的最新备份，已使用本地数据', 2600);
        }

        // 新增函数：导出书签到JSON文件
        function exportBookmarks() {
            if (state.bookmarks.length === 0) {
                showToast('没有书签可以导出', 2000);
                return;
            }
            
            // 创建导出数据对象
            const exportData = {
                version: '1.0',
                exportDate: new Date().toISOString(),
                bookmarks: state.bookmarks
            };
            
            // 转换为JSON字符串
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            
            // 创建下载链接
            const url = URL.createObjectURL(dataBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bookmarks-backup-${new Date().toISOString().split('T')[0]}.json`;
            
            // 触发下载
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // 清理URL对象
            setTimeout(() => URL.revokeObjectURL(url), 100);
            
            showToast(`已导出 ${state.bookmarks.length} 个书签`, 2000);
        }

        // 新增函数：处理文件导入
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }
            
            // 检查文件类型
            if (!file.name.endsWith('.json') && file.type !== 'application/json') {
                showToast('请选择JSON格式的文件', 2000);
                // 清空文件选择
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const importData = JSON.parse(content);
                    
                    // 验证导入数据格式
                    if (!importData.bookmarks || !Array.isArray(importData.bookmarks)) {
                        showToast('文件格式不正确，缺少书签数据', 2000);
                        return;
                    }
                    
                    // 验证每个书签的必要字段
                    const isValid = importData.bookmarks.every(b => 
                        b.id && b.name && b.url && typeof b.name === 'string' && typeof b.url === 'string'
                    );
                    
                    if (!isValid) {
                        showToast('文件格式不正确，书签数据不完整', 2000);
                        return;
                    }
                    
                    // 显示确认对话框
                    const confirmed = confirm(
                        `即将导入 ${importData.bookmarks.length} 个书签\n\n` +
                        `当前有 ${state.bookmarks.length} 个书签，导入会覆盖现有数据。\n\n` +
                        `是否继续导入？`
                    );
                    
                    if (confirmed) {
                        // 导入书签数据
                        state.bookmarks = importData.bookmarks.map((bookmark, index) => ({
                            ...bookmark,
                            order: bookmark.order !== undefined ? bookmark.order : index
                        }));
                        
                        // 保存到localStorage
                        saveBookmarks();
                        
                        // 重新渲染
                        renderCategories();
                        renderBookmarks();
                        clearSelection();
                        
                        showToast(`已成功导入 ${importData.bookmarks.length} 个书签`, 3000);
                    }
                } catch (error) {
                    console.error('导入失败:', error);
                    showToast('导入失败：文件格式不正确或已损坏', 2000);
                } finally {
                    // 清空文件选择
                    event.target.value = '';
                }
            };
            
            reader.onerror = function() {
                showToast('读取文件失败', 2000);
                event.target.value = '';
            };
            
            reader.readAsText(file);
        }

        // 新增函数：从URL导入JSON数据（可选功能）
        function importFromUrl(jsonUrl) {
            if (!confirm('从URL导入会覆盖当前所有书签，是否继续？')) {
                return;
            }
            
            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) throw new Error('网络响应不正常');
                    return response.json();
                })
                .then(data => {
                    if (!data.bookmarks || !Array.isArray(data.bookmarks)) {
                        throw new Error('数据格式不正确');
                    }
                    
                    state.bookmarks = data.bookmarks.map((bookmark, index) => ({
                        ...bookmark,
                        order: bookmark.order !== undefined ? bookmark.order : index
                    }));
                    
                    saveBookmarks();
                    renderCategories();
                    renderBookmarks();
                    clearSelection();
                    
                    showToast(`已从URL导入 ${data.bookmarks.length} 个书签`, 3000);
                })
                .catch(error => {
                    console.error('URL导入失败:', error);
                    showToast('导入失败：' + error.message, 2000);
                });
        }

        // 初始化拖拽排序
        function initSortable() {
            new Sortable(elements.bookmarksGrid, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                onEnd: function(evt) {
                    // 获取拖拽后的元素顺序
                    const bookmarks = Array.from(elements.bookmarksGrid.children)
                        .filter(el => el.classList.contains('bookmark-card'))
                        .map((el, index) => {
                            const id = el.dataset.id;
                            const bookmark = state.bookmarks.find(b => b.id === id);
                            if (bookmark) {
                                bookmark.order = index;
                            }
                            return bookmark;
                        })
                        .filter(Boolean);
                    
                    // 更新状态并保存
                    state.bookmarks = bookmarks;
                    saveBookmarks();
                }
            });
        }

        // 渲染分类
        function renderCategories() {
            // 获取所有分类
            const categories = ['all', ...new Set(state.bookmarks.map(b => b.category || '未分类'))];
            
            elements.categoriesContainer.innerHTML = categories.map(category => {
                const displayName = category === 'all' ? '全部网站' : category;
                const isActive = category === state.currentCategory;
                return `<button class="category-btn ${isActive ? 'active' : ''}" data-category="${category}">${displayName}</button>`;
            }).join('');
            
            // 添加分类点击事件
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;
                    state.currentCategory = category;
                    renderCategories();
                    renderBookmarks();
                });
            });
        }

        // 渲染书签
        function renderBookmarks() {
            // 过滤书签
            let filteredBookmarks = state.bookmarks;
            
            // 按分类过滤
            if (state.currentCategory !== 'all') {
                filteredBookmarks = filteredBookmarks.filter(
                    b => (b.category || '未分类') === state.currentCategory
                );
            }
            
            // 按搜索词过滤
            if (state.searchQuery) {
                filteredBookmarks = filteredBookmarks.filter(b => 
                    b.name.toLowerCase().includes(state.searchQuery) || 
                    b.url.toLowerCase().includes(state.searchQuery) ||
                    (b.tags && b.tags.some(tag => tag.toLowerCase().includes(state.searchQuery)))
                );
            }
            
            // 按order排序
            filteredBookmarks.sort((a, b) => (a.order || 0) - (b.order || 0));
            
            // 渲染书签卡片
            if (filteredBookmarks.length === 0) {
                elements.emptyState.style.display = 'block';
                elements.bookmarksGrid.innerHTML = '';
                elements.bookmarksGrid.appendChild(elements.emptyState);
            } else {
                elements.emptyState.style.display = 'none';
                
                elements.bookmarksGrid.innerHTML = filteredBookmarks.map(bookmark => {
                    const isSelected = state.selectedBookmarks.has(bookmark.id);
                    const tags = bookmark.tags && bookmark.tags.length > 0 
                        ? bookmark.tags.map(tag => `<span class="tag">${tag}</span>`).join('')
                        : '';
                    
                    return `
                        <div class="bookmark-card ${isSelected ? 'selected' : ''}" data-id="${bookmark.id}">
                            <div class="checkbox"></div>
                            <div class="bookmark-icon">
                                ${bookmark.icon 
                                    ? `<img src="${bookmark.icon}" alt="${bookmark.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\"fas fa-globe\"></i>';" />`
                                    : `<i class="fas fa-globe"></i>`
                                }
                            </div>
                            <div class="bookmark-title">${bookmark.name}</div>
                            <div class="bookmark-url">${bookmark.url.replace(/^https?:\/\//, '')}</div>
                            <div class="bookmark-tags">${tags}</div>
                            <div class="bookmark-actions">
                                <button class="edit-btn" title="编辑">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="delete-btn" title="删除">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // 添加书签卡片事件
                document.querySelectorAll('.bookmark-card').forEach(card => {
                    const id = card.dataset.id;
                    
                    // 点击卡片主体打开网站
                    card.addEventListener('click', (e) => {
                        // 如果点击的是按钮或复选框，不触发打开网站
                        if (e.target.closest('.checkbox') || 
                            e.target.closest('.bookmark-actions') ||
                            e.target.closest('button')) {
                            return;
                        }
                        
                        const bookmark = state.bookmarks.find(b => b.id === id);
                        if (bookmark) {
                            window.open(bookmark.url, '_blank');
                        }
                    });
                    
                    // 点击复选框选择/取消选择
                    const checkbox = card.querySelector('.checkbox');
                    if (checkbox) {
                        checkbox.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggleBookmarkSelection(id);
                        });
                    }
                    
                    // 编辑按钮
                    const editBtn = card.querySelector('.edit-btn');
                    if (editBtn) {
                        editBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            editBookmark(id);
                        });
                    }
                    
                    // 删除按钮
                    const deleteBtn = card.querySelector('.delete-btn');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteBookmark(id);
                        });
                    }
                });
            }
            
            // 更新选择栏状态
            updateSelectionBar();
        }

        // 切换书签选择状态
        function toggleBookmarkSelection(id) {
            if (state.selectedBookmarks.has(id)) {
                state.selectedBookmarks.delete(id);
            } else {
                state.selectedBookmarks.add(id);
            }
            
            renderBookmarks();
        }

        // 切换全选/全不选
        function toggleSelectAll() {
            const visibleBookmarkIds = getVisibleBookmarkIds();
            
            if (visibleBookmarkIds.length === 0) return;
            
            // 如果当前可见的书签都已经选中，则取消全选
            const allSelected = visibleBookmarkIds.every(id => state.selectedBookmarks.has(id));
            
            if (allSelected) {
                visibleBookmarkIds.forEach(id => state.selectedBookmarks.delete(id));
            } else {
                visibleBookmarkIds.forEach(id => state.selectedBookmarks.add(id));
            }
            
            renderBookmarks();
        }

        // 获取当前可见的书签ID
        function getVisibleBookmarkIds() {
            return state.bookmarks
                .filter(bookmark => {
                    // 按分类过滤
                    if (state.currentCategory !== 'all' && (bookmark.category || '未分类') !== state.currentCategory) {
                        return false;
                    }
                    
                    // 按搜索词过滤
                    if (state.searchQuery) {
                        const query = state.searchQuery.toLowerCase();
                        if (!bookmark.name.toLowerCase().includes(query) && 
                            !bookmark.url.toLowerCase().includes(query) &&
                            !(bookmark.tags && bookmark.tags.some(tag => tag.toLowerCase().includes(query)))) {
                            return false;
                        }
                    }
                    
                    return true;
                })
                .map(bookmark => bookmark.id);
        }

        // 打开选中的书签 - 改进版，避免浏览器阻止
        function openSelectedBookmarks() {
            if (state.selectedBookmarks.size === 0) {
                showToast('请先选择要打开的网站', 2000);
                return;
            }
            
            // 显示确认对话框
            const selectedCount = state.selectedBookmarks.size;
            const confirmed = confirm(`确定要打开 ${selectedCount} 个网站吗？\n我们将尝试逐个打开这些网站，请注意浏览器可能会阻止弹出窗口。`);
            
            if (!confirmed) {
                return;
            }
            
            // 收集所有要打开的URL
            const urlsToOpen = [];
            state.selectedBookmarks.forEach(id => {
                const bookmark = state.bookmarks.find(b => b.id === id);
                if (bookmark && bookmark.url) {
                    urlsToOpen.push({
                        url: bookmark.url,
                        name: bookmark.name
                    });
                }
            });
            
            if (urlsToOpen.length === 0) {
                showToast('没有找到有效的网站地址', 2000);
                return;
            }
            
            // 如果只有一个网站，直接打开
            if (urlsToOpen.length === 1) {
                window.open(urlsToOpen[0].url, '_blank');
                showToast(`已打开 ${urlsToOpen[0].name}`, 1500);
                clearSelection();
                return;
            }
            
            // 对于多个网站，使用延迟逐个打开
            let openedCount = 0;
            const openNext = (index) => {
                if (index >= urlsToOpen.length) {
                    showToast(`成功打开了 ${openedCount}/${urlsToOpen.length} 个网站`, 3000);
                    clearSelection();
                    return;
                }
                
                const site = urlsToOpen[index];
                try {
                    const newWindow = window.open(site.url, '_blank');
                    if (newWindow && !newWindow.closed) {
                        openedCount++;
                    }
                } catch (error) {
                    console.error(`无法打开网站: ${site.url}`, error);
                }
                
                // 延迟打开下一个网站，避免浏览器阻止
                setTimeout(() => {
                    openNext(index + 1);
                }, 500); // 500毫秒延迟
            };
            
            // 开始打开第一个网站
            openNext(0);
        }

        // 复制选中的URL到剪贴板
        function copySelectedUrls() {
            if (state.selectedBookmarks.size === 0) {
                showToast('请先选择要复制的网站', 2000);
                return;
            }
            
            // 收集URL
            const urls = [];
            const urlObjects = [];
            
            state.selectedBookmarks.forEach(id => {
                const bookmark = state.bookmarks.find(b => b.id === id);
                if (bookmark && bookmark.url) {
                    urls.push(bookmark.url);
                    urlObjects.push({
                        name: bookmark.name,
                        url: bookmark.url
                    });
                }
            });
            
            if (urls.length === 0) {
                showToast('没有找到有效的网站地址', 2000);
                return;
            }
            
            // 将URL列表格式化为文本
            const urlsText = urls.join('\n');
            
            // 使用现代剪贴板API
            navigator.clipboard.writeText(urlsText).then(() => {
                showToast(`已复制 ${urls.length} 个URL到剪贴板`, 2000);
                
                // 同时显示URL列表
                showUrlsList(urlObjects);
            }).catch(err => {
                console.error('复制失败:', err);
                // 回退方案
                const textArea = document.createElement('textarea');
                textArea.value = urlsText;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(`已复制 ${urls.length} 个URL到剪贴板（回退方案）`, 2000);
                    showUrlsList(urlObjects);
                } catch (copyErr) {
                    console.error('回退复制也失败:', copyErr);
                    showToast('复制失败，请手动复制', 3000);
                    showUrlsList(urlObjects);
                }
                document.body.removeChild(textArea);
            });
        }

        // 显示URL列表
        function showUrlsList(urlObjects) {
            // 清空现有内容
            elements.urlsListContent.innerHTML = '';
            
            // 添加URL列表
            urlObjects.forEach((site, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${index + 1}.</strong> <a href="${site.url}" target="_blank">${site.name}</a><br><small>${site.url}</small>`;
                elements.urlsListContent.appendChild(li);
            });
            
            // 显示列表
            elements.urlsList.classList.add('show');
            
            // 5秒后自动隐藏
            setTimeout(() => {
                if (elements.urlsList.classList.contains('show')) {
                    elements.urlsList.classList.remove('show');
                }
            }, 8000);
        }

        // 清空选择
        function clearSelection() {
            state.selectedBookmarks.clear();
            renderBookmarks();
        }

        // 更新选择栏
        function updateSelectionBar() {
            const selectedCount = state.selectedBookmarks.size;
            elements.selectedCount.textContent = selectedCount;
            
            if (selectedCount > 0) {
                elements.selectionBar.classList.add('active');
            } else {
                elements.selectionBar.classList.remove('active');
            }
        }

        // 打开模态框
        function openModal(bookmark = null) {
            elements.modalTitle.textContent = bookmark ? '编辑网站' : '添加新网站';
            elements.bookmarkName.value = bookmark ? bookmark.name : '';
            elements.bookmarkUrl.value = bookmark ? bookmark.url : '';
            elements.bookmarkCategory.value = bookmark ? (bookmark.category || '') : '';
            elements.bookmarkTags.value = bookmark ? (bookmark.tags ? bookmark.tags.join(', ') : '') : '';
            elements.bookmarkIcon.value = bookmark ? (bookmark.icon || '') : '';
            
            state.editingBookmarkId = bookmark ? bookmark.id : null;
            elements.bookmarkModal.classList.add('active');
            elements.bookmarkName.focus();
        }

        // 关闭模态框
        function closeModal() {
            elements.bookmarkModal.classList.remove('active');
            elements.bookmarkForm.reset();
            state.editingBookmarkId = null;
        }

        // 保存书签
        function saveBookmark() {
            const name = elements.bookmarkName.value.trim();
            const url = elements.bookmarkUrl.value.trim();
            const category = elements.bookmarkCategory.value.trim() || '未分类';
            const tags = elements.bookmarkTags.value.split(',').map(tag => tag.trim()).filter(tag => tag);
            const icon = elements.bookmarkIcon.value.trim();
            
            if (!name || !url) {
                showToast('网站名称和地址是必填项', 2000);
                return;
            }
            
            // 验证URL格式
            try {
                new URL(url);
            } catch {
                showToast('请输入有效的URL地址（以http://或https://开头）', 2000);
                return;
            }
            
            if (state.editingBookmarkId) {
                // 编辑现有书签
                const index = state.bookmarks.findIndex(b => b.id === state.editingBookmarkId);
                if (index !== -1) {
                    state.bookmarks[index] = {
                        ...state.bookmarks[index],
                        name,
                        url,
                        category,
                        tags,
                        icon: icon || getFaviconUrl(url)
                    };
                    showToast('网站已更新', 1500);
                }
            } else {
                // 添加新书签
                const newBookmark = {
                    id: Date.now().toString(),
                    name,
                    url,
                    category,
                    tags,
                    icon: icon || getFaviconUrl(url),
                    order: state.bookmarks.length
                };
                state.bookmarks.push(newBookmark);
                showToast('网站已添加', 1500);
            }
            
            saveBookmarks();
            renderCategories();
            renderBookmarks();
            closeModal();
        }

        // 编辑书签
        function editBookmark(id) {
            const bookmark = state.bookmarks.find(b => b.id === id);
            if (bookmark) {
                openModal(bookmark);
            }
        }

        // 删除书签
        function deleteBookmark(id) {
            if (confirm('确定要删除这个书签吗？')) {
                const index = state.bookmarks.findIndex(b => b.id === id);
                if (index !== -1) {
                    state.bookmarks.splice(index, 1);
                    state.selectedBookmarks.delete(id);
                    saveBookmarks();
                    renderCategories();
                    renderBookmarks();
                    showToast('网站已删除', 1500);
                }
            }
        }

        // 获取网站favicon
        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch {
                return '';
            }
        }

        // 初始渲染
        renderBookmarks();
    </script>
</body>
</html>
